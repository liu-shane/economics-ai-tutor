function shell(c){return `<header class="top"><div class="brand"><span class="logo">⌁</span>經濟學 AI 助教</div><div><span class="pill">${esc(S.student.className)}</span> <span class="pill">學號 ${esc(S.student.id)}</span></div></header><div class="layout"><nav class="nav">${[["home","⌂　學習首頁"],["units","✎　隨時測驗"],["tutor","✦　AI 諮詢專線"],["history","▥　學習歷程"]].map(x=>`<button data-v="${x[0]}" class="${S.view===x[0]?"on":""} ${x[0]==="teacher"?"teacher":""}">${x[1]}</button>`).join("")}<button id="logout">↪　登出</button></nav><main>${c}</main></div>`}
function mine(){return hist().filter(x=>x.id===S.student.id&&x.className===S.student.className)}
function home(){let h=mine(),avg=h.length?Math.round(h.reduce((a,b)=>a+b.score,0)/h.length):"—";return `<p class="kicker">歡迎回來 · ${esc(S.student.className)}</p><h1 class="title">今天想從哪裡開始？</h1><div class="tiles"><article class="card tile" data-v="units"><div class="ico">✎</div><h3>隨時測驗</h3><p>選擇單元，依題庫數量隨機抽 10 題或 5 題。</p><span class="go">開始測驗 →</span></article><article class="card tile" data-v="tutor"><div class="ico">✦</div><h3>AI 諮詢專線</h3><p>輸入經濟問題，立即獲得觀念解析。</p><span class="go">提出問題 →</span></article><article class="card tile" data-v="history"><div class="ico">▥</div><h3>學習歷程</h3><p>查看成績、弱點與累積進步。</p><span class="go">查看歷程 →</span></article></div><div class="stats"><div class="stat"><b>${h.length}</b><small>完成測驗</small></div><div class="stat"><b>${avg}</b><small>平均分數</small></div><div class="stat"><b>${h.filter(x=>x.score>=80).length}</b><small>80 分以上</small></div></div>`}
function units(){return `<p class="kicker">隨時測驗</p><h1 class="title">選擇練習單元</h1><p>每次隨機抽出 10 題，每題 10 分；交卷後立即提供詳解。</p><div class="units">${Object.keys(raw).map((u,i)=>`<button class="unit" data-unit="${esc(u)}"><small>UNIT ${i+1} · 題庫 12 題</small><b>${esc(u)}</b></button>`).join("")}</div>`}
function start(u){const count=Math.min(raw[u].length,raw[u].length<10?5:10);S.quiz={unit:u,qs:[...raw[u]].sort(()=>Math.random()-.5).slice(0,count)};S.ans=Array(count).fill(null);S.i=0;render("quiz")}
function quiz(){let q=S.quiz.qs[S.i];return `<p class="kicker">${esc(S.quiz.unit)}</p><h1 class="title">第 ${S.i+1} 題／${S.quiz.qs.length}</h1><div class="progress"><span style="width:${(S.i+1)*100/S.quiz.qs.length}%"></span></div><section class="card question"><h2>${esc(q[0])}</h2><div class="opts"><button class="opt ${S.ans[S.i]===1?"sel":""}" data-a="1">A. 正確</button><button class="opt ${S.ans[S.i]===0?"sel":""}" data-a="0">B. 錯誤</button></div></section><div class="actions"><button class="btn ghost" id="prev">${S.i?"← 上一題":"返回單元"}</button><button class="btn primary" id="next" ${S.ans[S.i]===null?"disabled":""}>${S.i===S.quiz.qs.length-1?"交卷看結果":"下一題 →"}</button></div>`}
function finish(){let n=S.quiz.qs.reduce((n,q,i)=>n+(S.ans[i]===q[1]),0),r={time:Date.now(),date:new Date().toLocaleString("zh-TW"),id:S.student.id,className:S.student.className,unit:S.quiz.unit,score:Math.round(n*100/S.quiz.qs.length),n,total:S.quiz.qs.length,qs:S.quiz.qs,ans:S.ans};let h=hist();h.unshift(r);save(h);app.innerHTML=shell(result(r));nav();retry.onclick=()=>start(r.unit);other.onclick=()=>render("units")}
function result(r){return `<section class="result"><div><p class="kicker" style="color:#8ff1e7">測驗完成</p><h1>${esc(r.unit)}</h1><p>答對 ${r.n}／${r.total} 題</p></div><div class="score">${r.score}</div></section><div class="actions"><button class="btn ghost" id="other">選其他單元</button><button class="btn primary" id="retry">再練一次</button></div>${r.qs.map((q,i)=>`<article class="card review ${r.ans[i]===q[1]?"":"bad"}"><b>第 ${i+1} 題 · ${r.ans[i]===q[1]?"答對了":"需要再複習"}</b><p>${esc(q[0])}</p><p>你的答案：${r.ans[i]?A:B}　｜　正確答案：${q[1]?A:B}</p><p>詳解：${esc(q[2])}</p></article>`).join("")}`}
const KB=[["機會成本","機會成本是選擇某方案時放棄的最佳替代方案價值。解題時先列出可行方案，再找被放棄方案中價值最高者。"],["供給","先判斷是商品自身價格改變造成沿曲線移動，或成本、技術等因素造成供給曲線位移。成本下降或技術進步通常使供給右移。"],["需求","自身價格改變造成需求量沿曲線移動；所得、偏好、相關商品價格等會使需求曲線位移。"],["彈性","需求價格彈性＝需求量變動百分比÷價格變動百分比。大於 1 為富有彈性，小於 1 為缺乏彈性；缺乏彈性時漲價通常提高總收益。"],["效用","消費者在預算限制下追求最高效用。內部最適點通常滿足每元支出的邊際效用相等。"],["成本","總成本＝固定成本＋變動成本。邊際成本是多生產一單位的額外成本；當 MC 低於平均成本時會拉低平均。"],["完全競爭","完全競爭廠商是價格接受者，所以 P＝MR，並在 MC 上升區間選擇 MR＝MC 的產量。"],["獨占","獨占者面對向下需求曲線，因此 MR＜P；以 MR＝MC 決定產量，再由需求曲線決定價格。"],["寡占","寡占廠商會互相影響，需用賽局觀點分析。納許均衡是給定他人策略時，沒有人想單方面改變。"],["資訊不對稱","逆向選擇發生在交易前的隱藏資訊；道德危險發生在交易後的隱藏行動。"]];
function answer(t){let x=KB.find(k=>t.includes(k[0]));return x?x[1]+"\n\n解題建議：先找出題目改變的因素，再判斷它影響哪條曲線或哪個邊際條件。":"請在問題中加入關鍵概念，例如：供需、彈性、效用、成本、完全競爭、獨占、寡占或資訊不對稱；也可以貼出題目與選項，我會用「觀念 → 判斷 → 結論」協助你。"}
function tutor(){return `<p class="kicker">AI 諮詢專線</p><h1 class="title">有問題，就從這裡問</h1><div class="chips">${["什麼是機會成本？","需求彈性怎麼判斷？","獨占為何有無謂損失？","資訊不對稱有哪些？"].map(x=>`<button class="chip" data-p="${x}">${x}</button>`).join("")}</div><section class="card chat"><div class="msgs" id="msgs"><div class="msg"><b>AI 助教</b>你好！請輸入經濟學問題，我會先說明觀念，再提供判斷步驟。</div></div><form class="ask" id="ask"><textarea id="question" placeholder="輸入你的經濟問題…" required></textarea><button class="btn primary">送出</button></form></section><div class="note">目前使用課程知識庫自動解答本學期核心單元；正式版可再串接校方核准的生成式 AI，處理更開放的跨章節問題。</div>`}
function send(t){msgs.insertAdjacentHTML("beforeend",`<div class="msg user">${esc(t)}</div><div class="msg"><b>AI 助教</b>${esc(answer(t))}</div>`);msgs.scrollTop=msgs.scrollHeight}
function history(){let h=mine();return `<p class="kicker">個人學習歷程</p><h1 class="title">每一次練習，都是進步的證據</h1>${h.length?`<div class="stats"><div class="stat"><b>${h.length}</b><small>累積測驗</small></div><div class="stat"><b>${Math.round(h.reduce((a,b)=>a+b.score,0)/h.length)}</b><small>平均分數</small></div><div class="stat"><b>${Math.max(...h.map(x=>x.score))}</b><small>最高分</small></div></div><div class="history">${h.map(x=>`<details class="card review"><summary><b>${esc(x.unit)}</b>　<strong>${x.score} 分</strong><br><small>${esc(x.date)} · 答對 ${x.n}/${x.total||10}</small></summary><div style="margin-top:14px">${x.qs.map((q,i)=>`<article class="review ${x.ans[i]===q[1]?"":"bad"}"><b>第 ${i+1} 題 · ${x.ans[i]===q[1]?"答對":"答錯"}</b><p>${esc(q[0])}</p><p>學生答案：${x.ans[i]?A:B}　｜　正確答案：${q[1]?A:B}</p><p>詳解：${esc(q[2])}</p></article>`).join("")}</div></details>`).join("")}</div>`:`<div class="card empty">尚未有測驗紀錄。完成第一份練習後，成績就會出現在這裡。</div>`}`}
function teacher(){let h=hist(),r=h.length?h:[{className:"時尚一甲",id:"11234001",unit:"供給、需求與市場均衡",score:80,date:"示範資料"},{className:"流通一甲",id:"11235012",unit:"彈性與政策應用",score:70,date:"示範資料"},{className:"國貿一甲",id:"11236008",unit:"獨占、寡占與資訊不對稱",score:90,date:"示範資料"}],avg=Math.round(r.reduce((a,b)=>a+b.score,0)/r.length);return `<section class="teacherHead"><p class="kicker" style="color:#ffc083">教師後台</p><h1>班級學習儀表板</h1><p>掌握各班參與、平均成績與練習單元。</p></section><div class="stats"><div class="stat"><b>${new Set(r.map(x=>x.id)).size}</b><small>參與學生</small></div><div class="stat"><b>${r.length}</b><small>完成測驗</small></div><div class="stat"><b>${avg}</b><small>平均成績</small></div></div><select id="filter" class="control filters"><option value="">全部班級</option>${CLS.map(x=>`<option>${x}</option>`).join("")}</select><div class="card tableWrap"><table class="table"><thead><tr><th>班級</th><th>學號</th><th>單元</th><th>成績</th><th>時間</th></tr></thead><tbody>${r.map(x=>`<tr data-c="${x.className}"><td>${x.className}</td><td>${x.id}</td><td>${x.unit}</td><td><b>${x.score} 分</b></td><td>${x.date}</td></tr>`).join("")}</tbody></table></div><div class="note">正式校務使用前，應串接校方帳號、雲端資料庫與教師權限驗證；目前版本供功能展示與課堂試用。</div>`}
function render(v){S.view=v;let c=v==="home"?home():v==="units"?units():v==="quiz"?quiz():v==="tutor"?tutor():v==="history"?history():teacher();app.innerHTML=shell(c);nav();bind()}
function nav(){document.querySelectorAll("[data-v]").forEach(x=>x.onclick=()=>render(x.dataset.v));logout.onclick=()=>{localStorage.removeItem("econStudent");S.student=null;login()}}
function bind(){if(S.view==="units")document.querySelectorAll("[data-unit]").forEach(x=>x.onclick=()=>start(x.dataset.unit));if(S.view==="quiz"){document.querySelectorAll("[data-a]").forEach(x=>x.onclick=()=>{S.ans[S.i]=+x.dataset.a;render("quiz")});prev.onclick=()=>{if(S.i){S.i--;render("quiz")}else render("units")};next.onclick=()=>{if(S.ans[S.i]===null)return;if(S.i===S.quiz.qs.length-1)finish();else{S.i++;render("quiz")}}}if(S.view==="tutor"){document.querySelectorAll("[data-p]").forEach(x=>x.onclick=()=>send(x.dataset.p));ask.onsubmit=e=>{e.preventDefault();send(question.value);question.value=""}}if(S.view==="teacher")filter.onchange=e=>document.querySelectorAll("tbody tr").forEach(x=>x.style.display=!e.target.value||x.dataset.c===e.target.value?"":"none")}
try{S.student=JSON.parse(localStorage.getItem("econStudent")||"null")}catch{}S.student?render("home"):login();
if(document.modelContext?.registerTool){document.modelContext.registerTool({name:"ask_economics_tutor",description:"回答經濟學概念問題",inputSchema:{type:"object",properties:{question:{type:"string"}},required:["question"]},annotations:{readOnlyHint:true},execute:({question})=>({answer:answer(question)})});}
</script><script src="./question-bank.js"></script><script src="./sync.js"></script><script src="./quiz-v2.js"></script><script src="./consult.js"></script></body></html>
